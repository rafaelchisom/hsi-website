<svg class="dhaf-logo-boxless" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 44" role="img" aria-label="Digital Healthcare Access Foundation" style="perspective:900px">
  <style>
    .dhaf-logo-boxless .dh-ltr{font-family:'Fraunces',Georgia,serif;font-weight:700;
      transform-box:fill-box;transform-origin:50% 50%;backface-visibility:visible;
      animation:dhafflip 1.1s cubic-bezier(.2,.7,.2,1) 1 both;}
    @keyframes dhafflip{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
    @media (prefers-reduced-motion: reduce){
      .dhaf-logo-boxless .dh-ltr{animation:none !important;}
    }
  </style>
  <text class="dh-ltr dh-D" x="2" y="33" font-size="40" fill="#FFFFFF">D</text>
  <text class="dh-ltr dh-H" x="36" y="33" font-size="40" fill="#FFFFFF">H</text>
  <text class="dh-ltr dh-A" x="70" y="33" font-size="40" fill="#13A89E">A</text>
  <text class="dh-ltr dh-F" x="101.5" y="33" font-size="40" fill="#13A89E">F</text>
</svg>
