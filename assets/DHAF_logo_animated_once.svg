<svg class="dhaf-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 76" role="img" aria-label="Digital Healthcare Access Foundation" style="perspective:900px">
  <style>
    .dhaf-logo .dh-card{fill:#0B2545;}
    .dhaf-logo .dh-border{fill:none;stroke:#13A89E;stroke-width:2.6;}
    .dhaf-logo .dh-ltr{font-family:'Fraunces',Georgia,serif;font-weight:700;dominant-baseline:central;
      transform-box:fill-box;transform-origin:50% 50%;backface-visibility:visible;
      animation:dhafflip 1.1s cubic-bezier(.2,.7,.2,1) 1 both;}
    @keyframes dhafflip{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
    @media (prefers-reduced-motion: reduce){
      .dhaf-logo .dh-ltr{animation:none !important;}
    }
  </style>
  <rect class="dh-card" x="0" y="0" width="210" height="76" rx="16" />
  <rect class="dh-border" x="8" y="8" width="194" height="60" rx="10" />
  <text class="dh-ltr dh-D" x="34" y="33" font-size="46" fill="#FFFFFF">D</text>
  <text class="dh-ltr dh-H" x="73" y="33" font-size="46" fill="#FFFFFF">H</text>
  <text class="dh-ltr dh-A" x="112" y="33" font-size="46" fill="#13A89E">A</text>
  <text class="dh-ltr dh-F" x="148" y="33" font-size="46" fill="#13A89E">F</text>
</svg>
